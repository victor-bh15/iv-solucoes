<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" aria-label="Byte — atendente da IV Soluções">
<style>
  .flu { animation: flu 3.8s ease-in-out infinite alternate; }
  @keyframes flu { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .som { transform-origin: center; animation: som 3.8s ease-in-out infinite alternate; }
  @keyframes som { from { transform: scaleX(1); opacity: 0.35; } to { transform: scaleX(0.8); opacity: 0.18; } }
  .pisca { transform-origin: center; animation: pisca 4.6s infinite; }
  .p2 { animation-delay: 0.12s; }
  @keyframes pisca { 0%, 91%, 100% { transform: scaleY(1); } 94%, 96% { transform: scaleY(0.06); } }
  .scan { animation: scan 4.5s linear infinite; }
  @keyframes scan { from { transform: translateY(-46px); } to { transform: translateY(58px); } }
  .glitch { animation: glitch 7s steps(1) infinite; }
  @keyframes glitch { 0%, 93%, 100% { transform: translate(0, 0); } 94% { transform: translate(-3px, 1px); } 95% { transform: translate(3px, -1px); } 96% { transform: translate(-1.5px, 0); } }
  .caret { animation: caret 1.1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0.12; } }
  .base { transform-origin: 120px 218px; animation: base 2.4s ease-in-out infinite alternate; }
  @keyframes base { from { transform: scaleX(1); opacity: 0.8; } to { transform: scaleX(1.18); opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) { .flu, .som, .pisca, .scan, .glitch, .caret, .base { animation: none; } }
</style>
<defs>
  <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12233F"/><stop offset="1" stop-color="#070F1E"/></linearGradient>
  <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5FD4FF" stop-opacity="0"/><stop offset="0.5" stop-color="#5FD4FF"/><stop offset="1" stop-color="#5FD4FF" stop-opacity="0"/></linearGradient>
  <filter id="fG" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="cT"><rect x="52" y="70" width="136" height="112" rx="24"/></clipPath>
</defs>
<ellipse class="som" cx="120" cy="243" rx="48" ry="8" fill="#000" opacity="0.5"/>
<g class="flu">
  <path d="M120 218 l-14 -28 h28 z" fill="rgba(95,212,255,0.14)"/>
  <rect class="base" x="86" y="214" width="68" height="7" rx="3.5" fill="url(#gB)" filter="url(#fG)"/>
  <g class="glitch">
    <rect x="52" y="70" width="136" height="112" rx="24" fill="url(#gP)" opacity="0.94"/>
    <rect x="52" y="70" width="136" height="112" rx="24" fill="none" stroke="#5FD4FF" stroke-width="2" opacity="0.65" filter="url(#fG)"/>
    <g clip-path="url(#cT)">
      <rect class="scan" x="52" y="70" width="136" height="10" fill="rgba(95,212,255,0.16)"/>
      <line x1="52" y1="94" x2="188" y2="94" stroke="rgba(95,212,255,0.08)" stroke-width="1"/>
      <line x1="52" y1="118" x2="188" y2="118" stroke="rgba(95,212,255,0.08)" stroke-width="1"/>
      <line x1="52" y1="142" x2="188" y2="142" stroke="rgba(95,212,255,0.08)" stroke-width="1"/>
      <line x1="52" y1="166" x2="188" y2="166" stroke="rgba(95,212,255,0.08)" stroke-width="1"/>
    </g>
    <text x="64" y="88" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" fill="#FF4D00" letter-spacing="1.5">byte//on</text>
    <g>
      <rect class="pisca" x="88" y="104" width="15" height="26" rx="4" fill="#5FD4FF" filter="url(#fG)"/>
      <rect class="pisca p2" x="137" y="104" width="15" height="26" rx="4" fill="#5FD4FF" filter="url(#fG)"/>
    </g>
    <rect class="caret" x="100" y="148" width="10" height="16" rx="2" fill="#FF4D00" filter="url(#fG)"/>
    <rect x="114" y="148" width="16" height="16" rx="2" fill="rgba(95,212,255,0.25)"/>
    <rect x="134" y="148" width="8" height="16" rx="2" fill="rgba(95,212,255,0.12)"/>
  </g>
</g>
</svg>
